<div class="home-page-main-parent-container" fxLayout="column" fxLayoutAlign="start stretch" fxLayoutGap="0.5em">
    <div class="home-page-main-header" fxLayout="row" fxLayoutAlign="start center">
        <span>{{mainHeaderName}}</span>
    </div>

    <div class="home-page-content" fxLayout="column" fxLayoutAlign="start stretch" fxLayoutGap="1em">
        <div class="search-bar">
            <input type="text" placeholder="Search for tools..." />
        </div>

        <div class="tools-list" fxLayout="row wrap" fxLayoutAlign="start stretch" fxLayoutGap="1em">
            <div class="tool-item" fxLayout="column" *ngFor="let tool of toolsList" (click)="toolClicked(tool)">
                <div class="tool-name">{{tool.name}}</div>
                <div class="tool-description">{{tool.description}}</div>
            </div>

        </div>
    </div>
</div>
